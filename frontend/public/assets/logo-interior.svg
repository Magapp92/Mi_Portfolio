      }

      .cls-6 {
        stroke-width: 3px;
      }

      .cls-7, .cls-9 {
        stroke-width: 9px;
      }

      .cls-8 {
        stroke-width: 8px;
      }

      .cls-8, .cls-9 {
        stroke-linecap: round;
      }

      .cls-11 {
        fill: #1fce15;
        font-family: Consolas, monospace;
        font-size: 7.19px;
      }

      .cls-4 {
        fill: #c7c7c7;
      }

      .cls-10 {
        stroke-width: 4px;
      }
    </style>
